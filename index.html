<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pi Runner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10051f;color:white;font-family:Arial;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100dvh}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:bold;pointer-events:none}
.badge{background:#210d38;border:1px solid #b65cff;border-radius:10px;padding:10px}
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#10051f99;text-align:center;padding:20px}
.panel{background:#1b0b2e;border:2px solid #a84dff;border-radius:20px;padding:25px;width:min(340px,95%)}
h1{color:#ffd35a;font-size:36px;margin:0}
p{line-height:1.5}
button{background:#ffd35a;border:0;border-radius:12px;padding:15px;width:100%;font-size:18px;font-weight:bold;margin-top:10px}
#hint{position:absolute;bottom:15px;left:0;right:0;text-align:center;font-size:13px;text-shadow:0 2px 4px black;pointer-events:none}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="badge">SCORE: <span id="score">0</span></div>
 <div class="badge">🟡 <span id="coins">0</span></div>
</div>

<div id="menu">
 <div class="panel">
  <h1>π PI RUNNER</h1>
  <p>Run through the futuristic city!<br>
  Collect golden coins and dodge traffic.</p>
  <p>SWIPE LEFT / RIGHT to move.<br>
  SWIPE UP to jump.</p>
  <button id="start">START RUN</button>
  <p style="font-size:12px">Virtual coins only. Not real Pi cryptocurrency.</p>
 </div>
</div>

<div id="hint">Swipe to move • Avoid the obstacles!</div>

<script>
(function(){
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const menu=document.getElementById("menu");
const scoreText=document.getElementById("score");
const coinText=document.getElementById("coins");

let W=0,H=0;
let running=false;
let lane=1;
let targetLane=1;
let score=0,coins=0,speed=3;
let playerY=0,jumpTime=0;
let objects=[];
let last=0,spawnTimer=0,elapsed=0;

function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

function roundedRect(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

function drawBackground(){
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#10051f");
 sky.addColorStop(.55,"#39205a");
 sky.addColorStop(1,"#13091e");
 ctx.fillStyle=sky;
 ctx.fillRect(0,0,W,H);

 // Moon
 ctx.fillStyle="#e6c9ff";
 ctx.beginPath();
 ctx.arc(W*.78,H*.16,Math.min(W,H)*.055,0,Math.PI*2);
 ctx.fill();

 // City buildings
 const horizon=H*.38;
 for(let side of [-1,1]){
  for(let i=0;i<8;i++){
   const bw=W*.075;
   const bh=H*(.12+(i%4)*.055);
   let x=side<0?i*bw*.9:W-i*bw*.9-bw;
   let y=horizon-bh;
   ctx.fillStyle=i%2?"#26133e":"#30204b";
   ctx.fillRect(x,y,bw,bh);
   ctx.fillStyle=i%3?"#bd72ff":"#ffd35a";
   for(let wy=y+12;wy<horizon-8;wy+=18){
    for(let wx=x+7;wx<x+bw-5;wx+=13){
     ctx.fillRect(wx,wy,4,6);
    }
   }
  }
 }

 // Road perspective
 ctx.fillStyle="#211a2d";
 ctx.beginPath();
 ctx.moveTo(W*.39,horizon);
 ctx.lineTo(W*.61,horizon);
 ctx.lineTo(W*1.1,H);
 ctx.lineTo(-W*.1,H);
 ctx.closePath();
 ctx.fill();

 // Road edges
 ctx.strokeStyle="#bd55ff";
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(W*.39,horizon);
 ctx.lineTo(-W*.1,H);
 ctx.moveTo(W*.61,horizon);
 ctx.lineTo(W*1.1,H);
 ctx.stroke();

 // Lane dividers
 const offset=(elapsed*speed*35)%70;
 for(let i=0;i<12;i++){
  const t=(i*70+offset)/H;
  const y=horizon+t*(H-horizon);
  if(y>H)continue;
  const spread=(y-horizon)*.42;
  const lineH=5+t*15;
  ctx.fillStyle="#c9b8e5";
  ctx.fillRect(W*.5-spread,y,3+t*4,lineH);
  ctx.fillRect(W*.5+spread,y,3+t*4,lineH);
 }
}

function laneX(l){
 return W*(.5+(l-1)*.19);
}

function drawPlayer(){
 const x=laneX(lane);
 const baseY=H*.79-playerY;
 const scale=Math.max(.65,Math.min(1.35,H/650));

 // Shadow
 ctx.fillStyle="#09041188";
 ctx.beginPath();
 ctx.ellipse(x,H*.81,25*scale,8*scale,0,0,Math.PI*2);
 ctx.fill();

 // Legs
 ctx.strokeStyle="#29243b";
 ctx.lineWidth=13*scale;
 ctx.lineCap="round";
 const swing=running?Math.sin(elapsed*speed*3)*10*scale:0;
 ctx.beginPath();
 ctx.moveTo(x-8*scale,baseY+32*scale);
 ctx.lineTo(x-12*scale+swing,baseY+57*scale);
 ctx.moveTo(x+8*scale,baseY+32*scale);
 ctx.lineTo(x+12*scale-swing,baseY+57*scale);
 ctx.stroke();

 // Shoes
 ctx.strokeStyle="#ffd35a";
 ctx.lineWidth=9*scale;
 ctx.beginPath();
 ctx.moveTo(x-12*scale+swing,baseY+57*scale);
 ctx.lineTo(x-19*scale+swing,baseY+59*scale);
 ctx.moveTo(x+12*scale-swing,baseY+57*scale);
 ctx.lineTo(x+19*scale-swing,baseY+59*scale);
 ctx.stroke();

 // Body
 roundedRect(x-19*scale,baseY-5*scale,38*scale,43*scale,9*scale,"#8e35d9");

 // Arms
 ctx.strokeStyle="#a66a4a";
 ctx.lineWidth=9*scale;
 ctx.beginPath();
 ctx.moveTo(x-18*scale,baseY+2*scale);
 ctx.lineTo(x-27*scale,baseY+23*scale+swing*.3);
 ctx.moveTo(x+18*scale,baseY+2*scale);
 ctx.lineTo(x+27*scale,baseY+23*scale-swing*.3);
 ctx.stroke();

 // Head
 ctx.fillStyle="#a66a4a";
 ctx.beginPath();
 ctx.arc(x,baseY-18*scale,15*scale,0,Math.PI*2);
 ctx.fill();

 // Hair
 ctx.fillStyle="#21162c";
 ctx.beginPath();
 ctx.arc(x,baseY-23*scale,15*scale,Math.PI,Math.PI*2);
 ctx.fill();

 // Pi emblem
 ctx.fillStyle="#ffd35a";
 ctx.font="bold "+(17*scale)+"px Arial";
 ctx.textAlign="center";
 ctx.fillText("π",x,baseY+22*scale);
}

function drawObjects(){
 objects.forEach(o=>{
  const progress=(o.z+100)/110;
  if(progress<0||progress>1.2)return;
  const y=H*.38+progress*H*.55;
  const x=W*.5+(o.lane-1)*progress*W*.38;
  const s=.2+progress*1.1;

  if(o.type==="coin"){
   ctx.save();
   ctx.translate(x,y);
   ctx.scale(s,s);
   ctx.fillStyle="#ffd044";
   ctx.strokeStyle="#fff0a1";
   ctx.lineWidth=3;
   ctx.beginPath();
   ctx.arc(0,0,13,0,Math.PI*2);
   ctx.fill();
   ctx.stroke();
   ctx.fillStyle="#7141a2";
   ctx.font="bold 19px Arial";
   ctx.textAlign="center";
   ctx.fillText("π",0,7);
   ctx.restore();
  }else{
   const w=42*s,h=45*s;
   roundedRect(x-w/2,y-h/2,w,h,6*s,
    o.type==="car"?"#d52f72":"#f0a82e");
   roundedRect(x-w*.32,y-h*.35,w*.64,h*.27,3*s,"#bceaff");
   ctx.fillStyle="#171020";
   ctx.fillRect(x-w*.4,y+h*.28,w*.2,h*.18);
   ctx.fillRect(x+w*.2,y+h*.28,w*.2,h*.18);
  }
 });
}

function spawnObjects(){
 const l=Math.floor(Math.random()*3);
 objects.push({
  lane:l,
  z:-100,
  type:Math.random()<.52?"coin":"car"
 });

 if(Math.random()<.5){
  objects.push({
   lane:Math.floor(Math.random()*3),
   z:-115,
   type:"coin"
  });
 }
}

function start(){
 running=true;
 lane=targetLane=1;
 score=0;coins=0;speed=3;
 elapsed=0;spawnTimer=0;
 playerY=0;jumpTime=0;
 objects=[];
 menu.style.display="none";
 last=performance.now();
 requestAnimationFrame(loop);
}

function gameOver(){
 running=false;
 menu.style.display="flex";
 menu.querySelector("h1").textContent="RUN OVER";
 menu.querySelector("p").innerHTML=
  "Score: "+Math.floor(score)+"<br>Coins collected: "+coins;
 document.getElementById("start").textContent="RUN AGAIN";
}

const startButton = document.getElementById("start");

function handleStartTap(event) {
  event.preventDefault();
  if (!running) {
    start();
  }
}

startButton.addEventListener("click", handleStartTap);
startButton.addEventListener("touchend", handleStartTap, { passive: false });

let sx=0,sy=0;
canvas.addEventListener("touchstart",e=>{
 sx=e.changedTouches[0].clientX;
 sy=e.changedTouches[0].clientY;
},{passive:true});

canvas.addEventListener("touchend",e=>{
 const dx=e.changedTouches[0].clientX-sx;
 const dy=e.changedTouches[0].clientY-sy;
 if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;

 if(Math.abs(dx)>Math.abs(dy)){
  targetLane=Math.max(0,Math.min(2,targetLane+(dx>0?1:-1)));
 }else if(dy<0&&jumpTime<=0){
  jumpTime=.75;
 }
},{passive:true});

addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")targetLane=Math.max(0,targetLane-1);
 if(e.key==="ArrowRight")targetLane=Math.min(2,targetLane+1);
 if(e.key==="ArrowUp"&&jumpTime<=0)jumpTime=.75;
});

function loop(now){
 if(!running)return;
 const dt=Math.min((now-last)/1000,.04);
 last=now;
 elapsed+=dt;
 speed=Math.min(3+elapsed*.12,8);
 score+=speed*dt*3;
 spawnTimer-=dt;

 if(spawnTimer<=0){
  spawnObjects();
  spawnTimer=Math.max(.65,1.4-elapsed*.006);
 }

 if(jumpTime>0){
  jumpTime-=dt;
  playerY=Math.sin((.75-jumpTime)/.75*Math.PI)*H*.12;
 }else playerY=0;

 objects.forEach(o=>o.z+=speed*dt*12);

 for(let i=objects.length-1;i>=0;i--){
  const o=objects[i];
  if(o.z>0&&o.z<8&&o.lane===lane){
   if(o.type==="coin"){
    coins++;
    objects.splice(i,1);
    continue;
   }else if(jumpTime<=0){
    gameOver();
    return;
   }
  }
  if(o.z>15)objects.splice(i,1);
 }

 drawBackground();
 drawObjects();
 drawPlayer();

 scoreText.textContent=Math.floor(score);
 coinText.textContent=coins;
 requestAnimationFrame(loop);
}

// Show the game scene behind the start menu.
drawBackground();
drawPlayer();

})();
</script>
</body>
</html>
