<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Runner - Galactic Adventure</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#100725;color:white;
 font-family:Arial,sans-serif;text-align:center
}
header{
 background:linear-gradient(120deg,#170b38,#422078,#170b38);
 padding:13px 6px 10px;
 border-bottom:2px solid #f7c945
}
h1{margin:0;color:#ffd65a;font-size:27px;letter-spacing:2px}
.subtitle{margin:5px 0;color:#e1d3ff;font-size:13px}
.stats{
 display:flex;justify-content:center;gap:22px;
 flex-wrap:wrap;padding:12px 5px;font-weight:bold
}
.stats span{color:#ffd65a}
.gamebox{
 position:relative;width:100%;max-width:520px;margin:auto;
 border:1px solid #6f43a2;overflow:hidden
}
canvas{
 display:block;width:100%;height:min(62vh,560px);
 min-height:350px;touch-action:none
}
.buttons{
 max-width:520px;margin:10px auto;display:flex;
 justify-content:center;gap:5px;flex-wrap:wrap
}
button{
 border:1px solid #ffe38a;border-radius:10px;
 background:linear-gradient(#ffe88a,#e6a926);
 color:#291344;font-size:14px;font-weight:bold;
 padding:12px 13px;min-height:44px
}
button:active{transform:scale(.96)}
#message{font-size:13px;color:#dfd0ff;margin:10px}
footer{font-size:11px;color:#b4a0d6;padding:12px}
</style>
</head>
<body>
<header>
 <h1>π PI RUNNER</h1>
 <div class="subtitle">GALACTIC ADVENTURE • SECTOR 001</div>
</header>

<div class="stats">
 <div>⭐ SCORE: <span id="score">0</span></div>
 <div>🟡 PI COINS: <span id="coins">0</span></div>
 <div>🏆 BEST: <span id="best">0</span></div>
</div>

<div class="gamebox">
 <canvas id="game" aria-label="Pi Runner game"></canvas>
</div>

<div class="buttons">
 <button id="left">⬅ LEFT</button>
 <button id="jump">⬆ JUMP</button>
 <button id="slide">⬇ SLIDE</button>
 <button id="right">RIGHT ➡</button>
</div>

<button id="start">🚀 START RUN</button>
<p id="message">Collect golden π coins and avoid the energy barriers!</p>

<footer>
PI RUNNER • Virtual game coins only. Not real Pi cryptocurrency.
</footer>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

let W=500,H=500;
let lane=1,score=0,coins=0,best=0;
let running=false,gameStarted=false;
let items=[],spawn=0,last=0,speed=0.0028;
let jumpPower=0,sliding=0,animation=0;
let stars=Array.from({length:65},()=>({
 x:Math.random(),y:Math.random(),r:Math.random()*1.7+.3
}));

function resize(){
 const r=canvas.getBoundingClientRect();
 const d=Math.min(window.devicePixelRatio||1,2);
 W=Math.max(280,r.width);
 H=Math.max(350,r.height);
 canvas.width=Math.round(W*d);
 canvas.height=Math.round(H*d);
 ctx.setTransform(d,0,0,d,0,0);
 draw();
}
window.addEventListener("resize",resize);

function road(t){
 return W*.5+(t===0?0:t)*W*(.11+.38*((t+0)/1));
}
function laneX(l,t){
 const half=W*(.13+.36*t);
 return W/2+(l-1)*half*.68;
}
function randomLane(){return Math.floor(Math.random()*3)}

function rounded(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}

function drawSky(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#100725");
 g.addColorStop(.55,"#291052");
 g.addColorStop(1,"#6530a2");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 // Stars
 for(const s of stars){
  ctx.fillStyle="rgba(255,230,180,.8)";
  ctx.beginPath();
  ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill();
  if(running){s.y+=.0009;if(s.y>1)s.y=0}
 }

 // Distant purple planet
 ctx.fillStyle="rgba(161,93,255,.17)";
 ctx.beginPath();ctx.arc(W*.78,H*.2,W*.16,0,7);ctx.fill();
 ctx.strokeStyle="rgba(225,190,255,.65)";
 ctx.lineWidth=2;ctx.beginPath();
 ctx.ellipse(W*.78,H*.2,W*.22,W*.055,-.25,0,Math.PI*2);
 ctx.stroke();

 // Futuristic skyline
 for(let i=0;i<12;i++){
  const x=i*W/11-W*.025;
  const bw=W*.055+(i%3)*W*.012;
  const bh=H*(.12+(i%4)*.035);
  const y=H*.55-bh;
  ctx.fillStyle=i%2?"#291347":"#37175a";
  ctx.fillRect(x,y,bw,bh);
  ctx.fillStyle="rgba(255,207,83,.75)";
  for(let wy=y+10;wy<H*.53;wy+=15){
   ctx.fillRect(x+5,wy,3,4);
   if(bw>25)ctx.fillRect(x+13,wy,3,4);
  }
  ctx.strokeStyle="rgba(180,120,255,.6)";
  ctx.strokeRect(x,y,bw,bh);
 }

 // Horizon glow
 let glow=ctx.createLinearGradient(0,H*.43,0,H*.7);
 glow.addColorStop(0,"rgba(255,196,66,.22)");
 glow.addColorStop(1,"rgba(125,65,255,0)");
 ctx.fillStyle=glow;ctx.fillRect(0,H*.4,W,H*.3);
}

function drawRoad(){
 const horizon=H*.32;
 ctx.fillStyle="#170b31";
 ctx.beginPath();
 ctx.moveTo(W*.42,horizon);
 ctx.lineTo(W*.58,horizon);
 ctx.lineTo(W*1.05,H);
 ctx.lineTo(-W*.05,H);
 ctx.closePath();ctx.fill();

 // Neon road edges
 ctx.strokeStyle="#c47aff";ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(W*.42,horizon);ctx.lineTo(-W*.05,H);ctx.stroke();
 ctx.beginPath();ctx.moveTo(W*.58,horizon);ctx.lineTo(W*1.05,H);ctx.stroke();

 // Road panels and lane markings
 for(let i=0;i<14;i++){
  let t=((i/14+animation*.8)%1);
  let y=horizon+t*(H-horizon);
  let half=W*(.08+.42*t);
  ctx.strokeStyle="rgba(165,102,255,"+(.2+.5*t)+")";
  ctx.lineWidth=1+2*t;
  ctx.beginPath();ctx.moveTo(W/2-half,y);ctx.lineTo(W/2+half,y);ctx.stroke();

  for(let j=1;j<3;j++){
   const lx=W/2+(j-1.5)*half*.66;
   ctx.strokeStyle="rgba(225,198,255,"+(.12+.48*t)+")";
   ctx.beginPath();
   ctx.moveTo(lx,y);ctx.lineTo(lx,y+4+t*10);ctx.stroke();
  }
 }

 // Pi gate at the horizon
 ctx.save();
 ctx.shadowBlur=18;ctx.shadowColor="#ffd45a";
 ctx.strokeStyle="#ffd45a";ctx.lineWidth=3;
 ctx.beginPath();ctx.ellipse(W/2,H*.36,W*.09,H*.045,0,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle="#ffe18a";ctx.font="bold "+Math.max(15,W*.05)+"px Arial";
 ctx.textAlign="center";ctx.fillText("π",W/2,H*.365+5);
 ctx.restore();
}

function drawCoin(x,y,t){
 const rad=8+t*8;
 ctx.save();ctx.translate(x,y);
 ctx.shadowColor="#ffd84d";ctx.shadowBlur=15;
 const g=ctx.createRadialGradient(-rad*.3,-rad*.3,1,0,0,rad);
 g.addColorStop(0,"#fff4b0");g.addColorStop(.5,"#ffd044");g.addColorStop(1,"#ba7915");
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#fff1a4";ctx.lineWidth=2;ctx.stroke();
 ctx.shadowBlur=0;ctx.fillStyle="#5b287f";
 ctx.font="bold "+rad*1.25+"px Arial";ctx.textAlign="center";
 ctx.textBaseline="middle";ctx.fillText("π",0,1);
 ctx.restore();
}

function drawObstacle(o){
 const t=Math.max(.05,o.p);
 const x=laneX(o.lane,t),y=H*.32+t*(H*.68);
 const sz=12+t*30;
 ctx.save();
 ctx.shadowColor="#ff3f91";ctx.shadowBlur=12;
 if(o.type==="barrier"){
  rounded(x-sz*.8,y-sz*.28,sz*1.6,sz*.56,5,"#ff397e");
  ctx.fillStyle="#ffd3eb";
  ctx.fillRect(x-sz*.65,y-sz*.08,sz*1.3,sz*.12);
 }else{
  rounded(x-sz*.58,y-sz*.8,sz*1.16,sz*1.6,5,"#7a40dc");
  ctx.strokeStyle="#f6dfff";ctx.lineWidth=2;
  ctx.strokeRect(x-sz*.58,y-sz*.8,sz*1.16,sz*1.6);
  ctx.fillStyle="#ff5ba8";
  ctx.fillRect(x-sz*.25,y-sz*.5,sz*.5,sz);
 }
 ctx.restore();
}

function drawHuman(x,y){
 const lift=jumpPower;
 const bodyY=y-lift;
 const scale=Math.max(.65,Math.min(1.25,H/480));
 ctx.save();ctx.translate(x,bodyY);ctx.scale(scale,scale);

 // Shadow
 ctx.fillStyle="rgba(0,0,0,.35)";
 ctx.beginPath();ctx.ellipse(0,25+lift*.2,19,6,0,0,7);ctx.fill();

 // Legs
 ctx.strokeStyle="#d8c6ff";ctx.lineWidth=8;ctx.lineCap="round";
 const run=running?Math.sin(animation*18)*8:0;
 ctx.beginPath();ctx.moveTo(-6,8);ctx.lineTo(-9+run,24);ctx.stroke();
 ctx.beginPath();ctx.moveTo(6,8);ctx.lineTo(9-run,24);ctx.stroke();

 // Golden shoes
 ctx.strokeStyle="#ffd54c";ctx.lineWidth=6;
 ctx.beginPath();ctx.moveTo(-9+run,24);ctx.lineTo(-3+run,24);ctx.stroke();
 ctx.beginPath();ctx.moveTo(9-run,24);ctx.lineTo(15-run,24);ctx.stroke();

 // Arms
 ctx.strokeStyle="#bb87ff";ctx.lineWidth=7;
 ctx.beginPath();ctx.moveTo(-10,-10);ctx.lineTo(-17,-1+run*.6);ctx.stroke();
 ctx.beginPath();ctx.moveTo(10,-10);ctx.lineTo(17,-1-run*.6);ctx.stroke();

 // Purple futuristic jacket
 ctx.shadowColor="#a65bff";ctx.shadowBlur=10;
 rounded(-12,-16,24,27,6,"#7a36d0");
 ctx.shadowBlur=0;
 ctx.strokeStyle="#ffd54c";ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(0,5);ctx.stroke();
 ctx.fillStyle="#ffe077";
 ctx.beginPath();ctx.arc(0,-5,3,0,7);ctx.fill();

 // Neck and head
 ctx.fillStyle="#a86d45";ctx.fillRect(-4,-23,8,8);
 ctx.fillStyle="#b87f5a";
 ctx.beginPath();ctx.arc(0,-29,11,0,Math.PI*2);ctx.fill();

 // Hair
 ctx.fillStyle="#21132e";
 ctx.beginPath();ctx.arc(0,-33,11,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillRect(-10,-34,4,7);ctx.fillRect(6,-34,4,7);

 // Headband visor
 rounded(-9,-31,18,5,2,"#ffd34f");
 ctx.fillStyle="#fff5c1";ctx.fillRect(-5,-30,4,2);
 ctx.restore();
}

function draw(){
 if(!ctx)return;
 drawSky();drawRoad();

 // Items are drawn far away first
 const sorted=[...items].sort((a,b)=>a.p-b.p);
 for(const o of sorted){
  const t=Math.max(.02,o.p);
  const x=laneX(o.lane,t);
  const y=H*.32+t*(H*.68);
  if(o.type==="coin")drawCoin(x,y,t);
  else drawObstacle({...o,x,y});
 }

 const px=laneX(lane,.88);
 drawHuman(px,H*.85);

 if(!running){
  ctx.fillStyle="rgba(10,3,25,.64)";
  ctx.fillRect(0,H*.35,W,H*.29);
  ctx.textAlign="center";
  ctx.fillStyle="#ffdb65";
  ctx.font="bold "+Math.max(24,W*.075)+"px Arial";
  ctx.fillText(gameStarted?"RUN ENDED":"PI RUNNER",W/2,H*.45);
  ctx.fillStyle="white";
  ctx.font="bold 13px Arial";
  ctx.fillText(gameStarted?"Tap RESTART to try again":"YOUR GALACTIC ADVENTURE",W/2,H*.45+27);
 }
}

function updateUI(){
 $("score").textContent=score;
 $("coins").textContent=coins;
 $("best").textContent=best;
}

function startGame(){
 score=0;coins=0;lane=1;items=[];
 spawn=0;speed=.0028;jumpPower=0;sliding=0;
 running=true;gameStarted=true;last=0;
 $("message").textContent="Run, collect π coins and dodge the energy barriers!";
 $("start").textContent="↻ RESTART";
 updateUI();
 requestAnimationFrame(loop);
}

function move(d){
 if(running)lane=Math.max(0,Math.min(2,lane+d));
 draw();
}
function jump(){
 if(running&&jumpPower===0&&sliding<=0){
  jumpPower=75;
  setTimeout(()=>{jumpPower=0},550);
 }
}
function slide(){
 if(running&&sliding<=0&&jumpPower===0){
  sliding=1;
  setTimeout(()=>{sliding=0},450);
 }
}

$("left").addEventListener("click",()=>move(-1));
$("right").addEventListener("click",()=>move(1));
$("jump").addEventListener("click",jump);
$("slide").addEventListener("click",slide);
$("start").addEventListener("click",startGame);

let touchX=0,touchY=0;
canvas.addEventListener("touchstart",e=>{
 touchX=e.changedTouches[0].clientX;
 touchY=e.changedTouches[0].clientY;
},{passive:true});
canvas.addEventListener("touchend",e=>{
 const dx=e.changedTouches[0].clientX-touchX;
 const dy=e.changedTouches[0].clientY-touchY;
 if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);
 else if(dy<-25)jump();
 else if(dy>25)slide();
},{passive:true});

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")move(-1);
 if(e.key==="ArrowRight")move(1);
 if(e.key==="ArrowUp"||e.key===" ")jump();
 if(e.key==="ArrowDown")slide();
});

function loop(t){
 if(!running)return;
 if(!last)last=t;
 const dt=Math.min(40,t-last);
 last=t;
 animation+=dt/1000;
 score+=Math.max(0,Math.floor(dt/80));
 spawn+=dt;
 speed+=dt*.000000035;

 if(spawn>700){
  spawn=0;
  const l=randomLane();
  items.push({
   lane:l,p:0,
   type:Math.random()<.63?"coin":"obstacle",
   shape:Math.random()<.5?"barrier":"block"
  });
  if(Math.random()<.25){
   const other=(l+1+randomLane())%3;
   items.push({lane:other,p:.01,type:"coin",shape:"coin"});
  }
 }

 for(const o of items)o.p+=speed*dt;

 // Collisions near the runner
 for(const o of items){
  if(o.hit||o.lane!==lane||o.p<.78||o.p>.98)continue;
  o.hit=true;
  if(o.type==="coin"){
   coins++;
   score+=25;
  }else if(jumpPower<35&&sliding<=0){
   running=false;
   gameStarted=true;
   best=Math.max(best,score);
   $("message").textContent="Run over! Score: "+score+" • Coins: "+coins;
   $("start").textContent="↻ PLAY AGAIN";
   break;
  }
 }

 items=items.filter(o=>o.p<1.08);
 best=Math.max(best,score);
 updateUI();
 animation+=dt/1000;
 draw();

 if(running)requestAnimationFrame(loop);
}

resize();
draw();
</script>
</body>
</html>
